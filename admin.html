<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SnMac - Admin Paneli</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b12;
            color: #fff;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 40px auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: #15151f;
            border: 1px solid #272738;
            border-radius: 12px;
            padding: 20px;
            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .stat:hover {
            transform: translateY(-2px);
            border-color: #3b3b55;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .stat-title {
            color: #999;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
        }

        .panel {
            background: #15151f;
            border: 1px solid #272738;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        select,
        textarea,
        input {
            width: 100%;
            background: #0f0f17;
            color: white;
            border: 1px solid #303044;
            border-radius: 8px;
            padding: 11px;
            outline: none;
        }

        select {
            max-width: 300px;
        }

        select:focus,
        textarea:focus,
        input:focus {
            border-color: #8b5cf6;
        }

        .applications {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
        }

        .application-list {
            max-height: 700px;
            overflow-y: auto;
        }

        .application-item {
            padding: 15px;
            border: 1px solid #29293a;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition:
                0.2s,
                transform 0.2s ease;
        }

        .application-item:hover {
            border-color: #8b5cf6;
            background: #191923;
            transform: translateX(2px);
        }

        .application-item.active {
            border-color: #8b5cf6;
            background: #1b1727;
            box-shadow:
                inset 3px 0 0 #8b5cf6;
        }

        .application-name {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .application-type {
            color: #a78bfa;
            font-size: 12px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .application-discord {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-bekliyor {
            background: #3a3215;
            color: #f5d76e;
        }

        .status-kabul {
            background: #16361f;
            color: #70d98a;
        }

        .status-red {
            background: #3b1818;
            color: #f07878;
        }

        .detail-title {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .application-category {
            display: inline-block;
            padding: 6px 10px;
            margin-bottom: 20px;
            border-radius: 6px;
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.25);
            color: #a78bfa;
            font-size: 12px;
            font-weight: bold;
        }

        .question {
            margin-bottom: 20px;
        }

        .question-title {
            color: #a78bfa;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .question-answer {
            background: #0f0f17;
            border: 1px solid #272738;
            border-radius: 8px;
            padding: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            transition:
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .question-answer:hover {
            border-color: #36364c;
            background: #11111a;
        }

        .admin-actions {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #29293a;
        }

        .admin-actions button {
            margin-top: 10px;
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 12px;
            background: #8b5cf6;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition:
                background 0.2s ease,
                transform 0.15s ease,
                opacity 0.2s ease;
        }

        .admin-actions button:hover {
            background: #7c4ee8;
            transform: translateY(-1px);
        }

        .admin-actions button:active {
            transform: translateY(0);
        }

        .admin-actions button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .logout {
            float: right;
            background: transparent;
            color: #aaa;
            border: 1px solid #303044;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .logout:hover {
            color: white;
            border-color: #8b5cf6;
        }

        .empty {
            color: #888;
            text-align: center;
            padding: 30px 10px;
        }

        .error {
            background: #351919;
            color: #ff8c8c;
            border: 1px solid #5b2828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }


        /* =========================================
           SİNEMATİK DURUM EFEKTLERİ
        ========================================= */

        #statusEffect {
            position: fixed;
            inset: 0;
            z-index: 99999;
            pointer-events: none;
            opacity: 0;
            overflow: hidden;
        }


        /* KABUL */

        #statusEffect.accept {
            animation: acceptScreen 1.8s ease-out forwards;
        }

        #statusEffect.accept::before {
            content: "";
            position: absolute;

            width: 70vw;
            height: 70vw;

            max-width: 850px;
            max-height: 850px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(0.15);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.55) 0%,
                    rgba(255, 230, 170, 0.32) 18%,
                    rgba(255, 210, 110, 0.12) 40%,
                    transparent 72%
                );

            filter: blur(4px);

            animation:
                divineLight 1.8s ease-out forwards;
        }

        #statusEffect.accept::after {
            content: "";
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(255, 255, 255, 0.18),
                    rgba(255, 205, 100, 0.08) 35%,
                    transparent 68%
                );

            animation:
                divineGlow 1.8s ease-out forwards;
        }


        @keyframes acceptScreen {

            0% {
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            35% {
                opacity: 0.75;
            }

            60% {
                opacity: 0.38;
            }

            100% {
                opacity: 0;
            }

        }


        @keyframes divineLight {

            0% {
                transform:
                    translate(-50%, -50%)
                    scale(0.12);

                opacity: 0;
            }

            18% {
                transform:
                    translate(-50%, -50%)
                    scale(0.65);

                opacity: 1;
            }

            50% {
                transform:
                    translate(-50%, -50%)
                    scale(1.05);

                opacity: 0.65;
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    scale(1.6);

                opacity: 0;
            }

        }


        @keyframes divineGlow {

            0% {
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            50% {
                opacity: 0.45;
            }

            100% {
                opacity: 0;
            }

        }


        /* RED */

        #statusEffect.reject {
            animation:
                rejectScreen 1.7s ease-out forwards;
        }

        #statusEffect.reject::before {
            content: "";
            position: absolute;
            inset: -20%;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 15%,
                    rgba(0, 0, 0, 0.25) 42%,
                    rgba(0, 0, 0, 0.75) 100%
                );

            animation:
                shadowFall 1.7s ease-out forwards;
        }

        #statusEffect.reject::after {
            content: "";
            position: absolute;

            width: 80vw;
            height: 80vw;

            max-width: 1000px;
            max-height: 1000px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(0.6);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    transparent 0%,
                    rgba(0, 0, 0, 0.18) 45%,
                    rgba(0, 0, 0, 0.7) 100%
                );

            animation:
                darkCore 1.7s ease-out forwards;
        }


        @keyframes rejectScreen {

            0% {
                opacity: 0;
            }

            15% {
                opacity: 0.85;
            }

            40% {
                opacity: 0.62;
            }

            65% {
                opacity: 0.3;
            }

            100% {
                opacity: 0;
            }

        }


        @keyframes shadowFall {

            0% {
                transform:
                    scale(0.8)
                    rotate(-3deg);

                opacity: 0;
            }

            25% {
                transform:
                    scale(1)
                    rotate(0deg);

                opacity: 1;
            }

            65% {
                transform:
                    scale(1.08)
                    rotate(2deg);

                opacity: 0.7;
            }

            100% {
                transform:
                    scale(1.2)
                    rotate(4deg);

                opacity: 0;
            }

        }


        @keyframes darkCore {

            0% {
                transform:
                    translate(-50%, -50%)
                    scale(0.5);

                opacity: 0;
            }

            20% {
                transform:
                    translate(-50%, -50%)
                    scale(0.85);

                opacity: 0.8;
            }

            55% {
                transform:
                    translate(-50%, -50%)
                    scale(1.1);

                opacity: 0.55;
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    scale(1.45);

                opacity: 0;
            }

        }


        @media (max-width: 850px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .applications {
                grid-template-columns: 1fr;
            }

            .application-list {
                max-height: none;
            }

        }

    </style>
</head>


<body>


<div id="statusEffect"></div>


<div class="container">


    <button
        class="logout"
        id="logoutBtn"
    >
        Çıkış Yap
    </button>


    <h1>
        SnMac Admin Paneli
    </h1>


    <div class="subtitle">
        Başvuruları görüntüleyebilir, değerlendirebilir ve başvuru sahiplerine geri bildirim bırakabilirsiniz.
    </div>


    <div
        id="errorBox"
        class="error"
    ></div>


    <div class="stats">


        <div class="stat">

            <div class="stat-title">
                Toplam Başvuru
            </div>

            <div
                class="stat-value"
                id="totalCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Bekleyen
            </div>

            <div
                class="stat-value"
                id="pendingCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Sonuçlanan
            </div>

            <div
                class="stat-value"
                id="completedCount"
            >
                0
            </div>

        </div>


    </div>


    <div class="panel">

        <div class="filters">

            <select id="statusFilter">

                <option value="all">
                    Tüm Başvurular
                </option>

                <option value="Bekliyor">
                    Bekliyor
                </option>

                <option value="Kabul Edildi">
                    Kabul Edildi
                </option>

                <option value="Reddedildi">
                    Reddedildi
                </option>

            </select>

        </div>

    </div>


    <div class="applications">


        <div class="panel">

            <h2>
                Başvurular
            </h2>


            <div
                id="applicationList"
                class="application-list"
            >

                <div class="empty">
                    Başvurular yükleniyor...
                </div>

            </div>

        </div>


        <div class="panel">


            <div
                id="emptyDetail"
                class="empty"
            >
                Görüntülemek için bir başvuru seçin.
            </div>


            <div
                id="applicationDetail"
                style="display:none;"
            >

                <div
                    class="detail-title"
                    id="detailTitle"
                >
                    Başvuru Detayları
                </div>


                <div
                    class="application-category"
                    id="applicationCategory"
                ></div>


                <!--
                    DETAYLAR JAVASCRIPT TARAFINDAN
                    BAŞVURU TÜRÜNE GÖRE OLUŞTURULACAK
                -->

                <div id="detailQuestions"></div>


                <div class="question">

                    <div class="question-title">
                        Başvuru Tarihi
                    </div>

                    <div
                        class="question-answer"
                        id="detailDate"
                    ></div>

                </div>


                <div class="admin-actions">


                    <h3>
                        Başvuruyu Değerlendir
                    </h3>


                    <label>
                        Durum
                    </label>


                    <select id="statusSelect">

                        <option value="Bekliyor">
                            Bekliyor
                        </option>

                        <option value="Kabul Edildi">
                            Kabul Edildi
                        </option>

                        <option value="Reddedildi">
                            Reddedildi
                        </option>

                    </select>


                    <br><br>


                    <label>
                        Başvuru Sahibine Mesaj
                    </label>


                    <textarea
                        id="adminMessage"
                        rows="5"
                        placeholder="Başvuru sahibi için bir mesaj yazabilirsiniz..."
                    ></textarea>


                    <button id="saveBtn">
                        Değişiklikleri Kaydet
                    </button>


                </div>

            </div>

        </div>

    </div>

</div>


<script>


    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
        "https://drfborwvynrwfljrqlmg.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_Sw6ra8A72oj7dXNnCX__rA_ZNxGtrpn";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================================
       STATE
    ========================================= */

    let applications = [];

    let selectedApplication = null;


    /* =========================================
       SES SİSTEMİ
    ========================================= */

    let audioContext = null;


    function initAudio() {

        try {

            if (!audioContext) {

                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;

                if (!AudioContext) {
                    return;
                }

                audioContext =
                    new AudioContext();

            }


            if (
                audioContext.state ===
                "suspended"
            ) {

                audioContext.resume();

            }

        }

        catch (error) {

            console.log(
                "Ses sistemi başlatılamadı.",
                error
            );

        }

    }


    document.addEventListener(
        "click",
        initAudio,
        {
            once: true
        }
    );


    /* =========================================
       KABUL SESİ
    ========================================= */

    function playAcceptSound() {

        initAudio();

        if (!audioContext) {
            return;
        }


        const now =
            audioContext.currentTime;


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency
            .setValueAtTime(
                330,
                now
            );


        oscillator.frequency
            .exponentialRampToValueAtTime(
                660,
                now + 0.38
            );


        gain.gain
            .setValueAtTime(
                0.0001,
                now
            );


        gain.gain
            .exponentialRampToValueAtTime(
                0.15,
                now + 0.05
            );


        gain.gain
            .exponentialRampToValueAtTime(
                0.0001,
                now + 0.8
            );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start(now);

        oscillator.stop(
            now + 0.85
        );

    }


    /* =========================================
       RED SESİ
    ========================================= */

    function playRejectSound() {

        initAudio();

        if (!audioContext) {
            return;
        }


        const now =
            audioContext.currentTime;


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.type =
            "triangle";


        oscillator.frequency
            .setValueAtTime(
                190,
                now
            );


        oscillator.frequency
            .exponentialRampToValueAtTime(
                65,
                now + 0.52
            );


        gain.gain
            .setValueAtTime(
                0.0001,
                now
            );


        gain.gain
            .exponentialRampToValueAtTime(
                0.16,
                now + 0.035
            );


        gain.gain
            .exponentialRampToValueAtTime(
                0.0001,
                now + 0.8
            );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start(now);

        oscillator.stop(
            now + 0.85
        );

    }


    /* =========================================
       DURUM EFEKTİ
    ========================================= */

    function playStatusEffect(status) {

        const effect =
            document.getElementById(
                "statusEffect"
            );


        effect.className = "";


        void effect.offsetWidth;


        if (
            status ===
            "Kabul Edildi"
        ) {

            effect.classList.add(
                "accept"
            );

            playAcceptSound();

        }


        else if (
            status ===
            "Reddedildi"
        ) {

            effect.classList.add(
                "reject"
            );

            playRejectSound();

        }


        setTimeout(
            () => {

                effect.className = "";

            },
            1900
        );

    }


    /* =========================================
       HATA
    ========================================= */

    const errorBox =
        document.getElementById(
            "errorBox"
        );


    function showError(message) {

        errorBox.textContent =
            message;

        errorBox.style.display =
            "block";

    }


    function hideError() {

        errorBox.style.display =
            "none";

    }


    /* =========================================
       HTML ESCAPE
    ========================================= */

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "-";

        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =========================================
       STATUS CLASS
    ========================================= */

    function statusClass(status) {

        if (
            status ===
            "Kabul Edildi"
        ) {

            return "status-kabul";

        }


        if (
            status ===
            "Reddedildi"
        ) {

            return "status-red";

        }


        return "status-bekliyor";

    }


    /* =========================================
       TARİH
    ========================================= */

    function formatDate(date) {

        if (!date) {
            return "-";
        }


        return new Date(
            date
        ).toLocaleString(
            "tr-TR"
        );

    }


    /* =========================================
       BAŞVURU TÜRÜ
    ========================================= */

    function getApplicationTypeName(type) {

        if (
            type ===
            "yetkili"
        ) {

            return "Yetkili Başvurusu";

        }


        if (
            type ===
            "medya"
        ) {

            return "Medya Başvurusu";

        }


        if (
            type ===
            "gelistirici"
        ) {

            return "Geliştirici Başvurusu";

        }


        if (
            type ===
            "aac"
        ) {

            return "AAC Başvurusu";

        }


        return "Başvuru";

    }


    /* =========================================
       SORU KUTUSU OLUŞTUR
    ========================================= */

    function createQuestion(
        title,
        value
    ) {

        return `

            <div class="question">

                <div class="question-title">
                    ${escapeHtml(title)}
                </div>

                <div class="question-answer">
                    ${escapeHtml(
                        value
                    )}
                </div>

            </div>

        `;

    }


    /* =========================================
       MEDYA DETAYLARI
    ========================================= */

    function renderMediaDetails(app) {

        const container =
            document.getElementById(
                "detailQuestions"
            );


        container.innerHTML =

            createQuestion(
                "Adınız nedir?",
                app.fullname
            )

            +

            createQuestion(
                "Kaç yaşındasınız?",
                app.age
            )

            +

            createQuestion(
                "Discord kullanıcı adınız nedir?",
                app.discord
            )

            +

            createQuestion(
                "Hangi platformlarda içerik üretiyorsunuz?",
                app.platforms
            )

            +

            createQuestion(
                "Kanal, profil veya içerik bağlantılarınızı paylaşınız.",
                app.links
            )

            +

            createQuestion(
                "Daha önce içerik üretme konusunda deneyiminiz oldu mu?",
                app.media_experience
            )

            +

            createQuestion(
                "Ortalama izlenme, takipçi veya diğer istatistikleriniz nelerdir?",
                app.statistics
            )

            +

            createQuestion(
                "Ne tür içerikler üretiyorsunuz veya üretmeyi planlıyorsunuz?",
                app.content_type
            )

            +

            createQuestion(
                "SnMac medya ekibinde neden yer almak istiyorsunuz?",
                app.motivation
            )

            +

            createQuestion(
                "Günlük olarak medya ekibine ortalama ne kadar zaman ayırabilirsiniz?",
                app.availability
            )

            +

            createQuestion(
                "SnMac için içerik üretimi veya medya ekibiyle işbirliği konusunda neler yapabilirsiniz?",
                app.collaboration
            )

            +

            createQuestion(
                "Medya alanındaki hedeflerinizden ve kendinizden biraz bahseder misiniz?",
                app.about
            );

    }


    /* =========================================
       YETKİLİ DETAYLARI
    ========================================= */

    function renderStaffDetails(app) {

        const container =
            document.getElementById(
                "detailQuestions"
            );


        container.innerHTML =

            createQuestion(
                "Adınız ve soyadınız nedir?",
                app.fullname
            )

            +

            createQuestion(
                "Kaç yaşındasınız?",

            createQuestion(

                app.experience

            +

            createQuestion(
                "Gün içerisinde genellikle neler yaparsınız?",
                app.activity
            )

            +

            createQuestion(
                "Günde ortalama kaç saatinizi yetkili olarak görev yapmaya ayırabilirsiniz?",
                app.availability
            )

            +

            createQuestion(
                "Kullanabileceğiniz bir mikrofonunuz bulunuyor mu?",
                app.microphone
            )

            +

            createQuestion(
                "SnMac sunucusunda yetkili olarak görev almak istemenizin temel nedeni nedir?",
                app.motivation
            )

            +

            createQuestion(
                "Yetkili olduğunuz sırada yakın olduğunuz bir arkadaşınızın kural ihlali yaptığını fark ettiniz. Bu durumda nasıl bir tutum sergilersiniz?",

                "Yeni bir oyuncunun size aynı veya benzer basit soruları sürekli olarak sorduğunu düşünün. Bu durumda nasıl davranırsınız?",
                app.repeated_questions

                "Bize biraz kendinizden bahseder misiniz?",

            createQuestion(
                "Bir ekip arkadaşınızla veya sizden daha alt ya da üst yetkide bulunan bir yetkiliyle anlaşmazlık yaşadığınızı düşünün. Bu durumda sorunu nasıl çözmeye çalışırsınız?",
                app.conflict
            );

    }


    /* =========================================
       GELİŞTİRİCİ DETAYLARI
    ========================================= */

    function renderDeveloperDetails(app) {

        const container =
            document.getElementById(
                "detailQuestions"
            );


        container.innerHTML =

            createQuestion(

                app.fullname
            )

            +

            createQuestion(
                "Kaç yaşındasınız?",
                app.age

            +

            createQuestion(
                "Discord kullanıcı adınız nedir?",
                app.discord
            )

            +

            createQuestion(
                "Hangi programlama dillerini biliyorsunuz?",
                app.programming_languages
            )

            +

            createQuestion(
                "Hangi alanlarda geliştirme yapabiliyorsunuz?",
                app.development_areas
            )

            +

            createQuestion(
                "Daha önce yaptığınız projeler var mı?",
                app.projects
            )

            +

            createQuestion(
                "GitHub, web sitesi veya projelerinizi gösterebileceğiniz bağlantılarınız",
                app.portfolio
            )

            createQuestion(

            +

            createQuestion(
                "Bize biraz kendinizden ve geliştirici olarak hedeflerinizden bahseder misiniz?",

            );

    }


    /* =========================================
       DETAYLARI RENDER ET
    ========================================= */

    function renderApplicationDetails(app) {

        const type =
            app.application_type;


        if (
            type ===
            "medya"
        ) {

            renderMediaDetails(app);

            return;

        }


        if (
            type ===
            "gelistirici"
        ) {

            renderDeveloperDetails(app);

            return;

        }


        renderStaffDetails(app);

    }


    /* =========================================
       ADMIN KONTROLÜ
    ========================================= */

    async function checkAdmin() {

        const {
            data: {
                session
            }
        } =
            await supabaseClient
                .auth
                .getSession();


        if (!session) {

            window.location.href =
                "login.html";

            return false;

        }


        const {
            data,
            error
        } =
            await supabaseClient
                .rpc(
                    "is_admin"
                );


        if (error) {

            showError(
                "Yönetici kontrolü sırasında bir hata oluştu."
            );

            return false;

        }


        if (!data) {

            document.body.innerHTML = `

                <div style="
                    min-height:100vh;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:#0b0b12;
                    color:white;
                    font-family:Arial;
                    text-align:center;
                    padding:20px;
                ">

                    <div>

                        <h1>
                            Yetkiniz bulunmuyor.
                        </h1>

                        <p style="
                            color:#aaa;
                        ">
                            Bu sayfaya yalnızca yetkili yöneticiler erişebilir.
                        </p>

                    </div>

                </div>

            `;

            return false;

        }


        return true;

    }


    /* =========================================
       BAŞVURULARI YÜKLE
    ========================================= */

    async function loadApplications() {

        hideError();


        const {
            data,
            error
        } =
            await supabaseClient
                .from("applications")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            showError(
                "Başvurular yüklenirken hata oluştu: " +
                error.message
            );

            return;

        }


        applications =
            data || [];


        updateStats();

        renderApplications();

    }


    /* =========================================
       İSTATİSTİKLER
    ========================================= */

    function updateStats() {

        const total =
            applications.length;


        const pending =
            applications.filter(
                app =>
                    app.status ===
                    "Bekliyor"
            ).length;


        const completed =
            applications.filter(
                app =>
                    app.status ===
                        "Kabul Edildi" ||
                    app.status ===
                        "Reddedildi"
            ).length;


        document.getElementById(
            "totalCount"
        ).textContent =
            total;


        document.getElementById(
            "pendingCount"
        ).textContent =
            pending;


        document.getElementById(
            "completedCount"
        ).textContent =
            completed;

    }


    /* =========================================
       BAŞVURULARI GÖSTER
    ========================================= */

    function renderApplications() {

        const list =
            document.getElementById(
                "applicationList"
            );


        const filter =
            document.getElementById(
                "statusFilter"
            ).value;


        let filtered =
            applications;


        if (
            filter !==
            "all"
        ) {

            filtered =
                applications.filter(
                    app =>
                        app.status ===
                        filter
                );

        }


        if (
            filtered.length ===
            0
        ) {

            list.innerHTML = `

                <div class="empty">
                    Bu filtreye uygun başvuru bulunamadı.
                </div>

            `;

            return;

        }


        list.innerHTML =
            filtered
                .map(
                    app => {

                        const active =
                            selectedApplication &&
                            selectedApplication.id ===
                                app.id
                                ? "active"
                                : "";


                        return `

                            <div
                                class="application-item ${active}"
                                onclick="selectApplication('${escapeHtml(app.id)}')"
                            >

                                <div class="application-name">
                                    ${escapeHtml(
                                        app.fullname
                                    )}
                                </div>


                                <div class="application-type">
                                    ${escapeHtml(
                                        getApplicationTypeName(
                                            app.application_type
                                        )
                                    )}
                                </div>


                                <div class="application-discord">
                                    ${escapeHtml(
                                        app.discord
                                    )}
                                </div>


                                <span
                                    class="status ${statusClass(app.status)}"
                                >
                                    ${escapeHtml(
                                        app.status
                                    )}
                                </span>

                            </div>

                        `;

                    }
                )
                .join("");

    }


    /* =========================================
       BAŞVURU SEÇ
    ========================================= */

    window.selectApplication =
        function(id) {

            selectedApplication =
                applications.find(
                    app =>
                        app.id ===
                        id
                );


            if (
                !selectedApplication
            ) {

                return;

            }


            document.getElementById(
                "emptyDetail"
            ).style.display =
                "none";


            document.getElementById(
                "applicationDetail"
            ).style.display =
                "block";


            document.getElementById(
                "detailTitle"
            ).textContent =
                selectedApplication.fullname +
                " - Başvuru Detayları";


            document.getElementById(
                "applicationCategory"
            ).textContent =
                getApplicationTypeName(
                    selectedApplication.application_type
                );


            renderApplicationDetails(
                selectedApplication
            );


            document.getElementById(
                "detailDate"
            ).textContent =
                formatDate(
                    selectedApplication.created_at
                );


            document.getElementById(
                "statusSelect"
            ).value =
                selectedApplication.status ||
                "Bekliyor";


            document.getElementById(
                "adminMessage"
            ).value =
                selectedApplication.admin_message ||
                "";


            renderApplications();

        };


    /* =========================================
       FİLTRE
    ========================================= */

    document.getElementById(
        "statusFilter"
    )
    .addEventListener(
        "change",
        renderApplications
    );


    /* =========================================
       KAYDET
    ========================================= */

    document.getElementById(
        "saveBtn"
    )
    .addEventListener(
        "click",
        async () => {

            if (
                !selectedApplication
            ) {

                return;

            }


            hideError();


            const newStatus =
                document.getElementById(
                    "statusSelect"
                ).value;


            const adminMessage =
                document.getElementById(
                    "adminMessage"
                ).value.trim();


            const oldStatus =
                selectedApplication.status;


            const saveButton =
                document.getElementById(
                    "saveBtn"
                );


            saveButton.disabled =
                true;


            saveButton.textContent =
                "Kaydediliyor...";


            const {
                error
            } =
                await supabaseClient
                    .from("applications")
                    .update({

                        status:
                            newStatus,

                        admin_message:
                            adminMessage ||
                            null,

                        updated_at:
                            new Date()
                                .toISOString()

                    })
                    .eq(
                        "id",
                        selectedApplication.id
                    );


            if (error) {

                showError(
                    "Başvuru güncellenirken hata oluştu: " +
                    error.message
                );


                saveButton.disabled =
                    false;


                saveButton.textContent =
                    "Değişiklikleri Kaydet";


                return;

            }


            selectedApplication.status =
                newStatus;


            selectedApplication.admin_message =
                adminMessage ||
                null;


            const index =
                applications.findIndex(
                    app =>
                        app.id ===
                        selectedApplication.id
                );


            if (
                index !==
                -1
            ) {

                applications[index] =
                    selectedApplication;

            }


            updateStats();

            renderApplications();


            /*
                Sadece gerçek durum değişikliğinde
                kabul / red efekti çalışır.
            */

            if (
                oldStatus !==
                newStatus
            ) {

                if (
                    newStatus ===
                    "Kabul Edildi"
                ) {

                    playStatusEffect(
                        "Kabul Edildi"
                    );

                }


                else if (
                    newStatus ===
                    "Reddedildi"
                ) {

                    playStatusEffect(
                        "Reddedildi"
                    );

                }

            }


            saveButton.disabled =
                false;


            saveButton.textContent =
                "Değişiklikleri Kaydet";

        }
    );


    /* =========================================
       ÇIKIŞ
    ========================================= */

    document.getElementById(
        "logoutBtn"
    )
    .addEventListener(
        "click",
        async () => {

            await supabaseClient
                .auth
                .signOut();


            window.location.href =
                "login.html";

        }
    );


    /* =========================================
       BAŞLAT
    ========================================= */

    async function init() {

        const isAdmin =
            await checkAdmin();


        if (!isAdmin) {

            return;

        }


        await loadApplications();

    }


    init();

</script>
