<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SnMac | Yetkili Başvurusu</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                linear-gradient(rgba(0,0,0,0.72), rgba(0,0,0,0.82)),
                url("assets/background.jpg") center/cover fixed;
            color: white;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: auto;
        }

        .logo {
            display: block;
            width: 150px;
            max-width: 70%;
            margin: 0 auto 25px;
            border-radius: 15px;
        }

        .card {
            background: rgba(20, 20, 20, 0.94);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.45);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 30px;
        }

        .description {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .logged-user {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 25px;
            color: #bbb;
            font-size: 14px;
        }

        .logged-user span {
            color: white;
            font-weight: bold;
        }

        .question {
            margin-bottom: 23px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #eee;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #333;
            border-radius: 9px;
            background: #111;
            color: white;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #777;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        select {
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: white;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: #ddd;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            line-height: 1.5;
            word-break: break-word;
        }

        .success {
            background: rgba(0, 180, 80, 0.15);
            border: 1px solid rgba(0, 180, 80, 0.4);
            color: #6dff9d;
        }

        .error {
            background: rgba(220, 40, 40, 0.15);
            border: 1px solid rgba(220, 40, 40, 0.4);
            color: #ff7777;
        }

        .test-box {
            display: none;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #aaa;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .card {
                padding: 22px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <img
        src="assets/logo.jpg"
        alt="SnMac Logo"
        class="logo"
    >

    <div class="card">

        <h1>Yetkili Başvurusu</h1>

        <p class="description">
            SnMac yetkili ekibine katılmak için aşağıdaki formu eksiksiz
            ve doğru şekilde doldur.
        </p>

        <div class="logged-user">
            Giriş yapılan hesap:
            <span id="loggedEmail">Kontrol ediliyor...</span>
        </div>

        <div id="testBox" class="test-box">
            Sistem hazır. Form gönderme işlemi bekleniyor...
        </div>

        <form id="applicationForm">

            <!-- 1 -->
            <div class="question">
                <label for="fullname">
                    1. Adınız ve soyadınız nedir?
                </label>

                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Örn: Emir Yılmaz"
                    required
                >
            </div>

            <!-- 2 -->
            <div class="question">
                <label for="discord">
                    2. Discord kullanıcı adınız nedir?
                </label>

                <input
                    type="text"
                    id="discord"
                    name="discord"
                    placeholder="Örn: emiryilmaz"
                    required
                >
            </div>

            <!-- 3 -->
            <div class="question">
                <label for="age">
                    3. Kaç yaşındasınız?
                </label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    min="13"
                    max="80"
                    placeholder="Örn: 17"
                    required
                >
            </div>

            <!-- 4 -->
            <div class="question">
                <label for="activity">
                    4. Sunucuda günlük ortalama kaç saat aktif olabilirsiniz?
                </label>

                <textarea
                    id="activity"
                    name="activity"
                    placeholder="Örn: Günlük 4-6 saat aktif olabilirim."
                    required
                ></textarea>
            </div>

            <!-- 5 -->
            <div class="question">
                <label for="experience">
                    5. Daha önce yetkili oldunuz mu? Nerelerde ve hangi görevlerde bulundunuz?
                </label>

                <textarea
                    id="experience"
                    name="experience"
                    placeholder="Daha önceki yetkili deneyimlerinizi anlatın."
                    required
                ></textarea>
            </div>

            <!-- 6 -->
            <div class="question">
                <label for="motivation">
                    6. Neden yetkili olmak istiyorsunuz?
                </label>

                <textarea
                    id="motivation"
                    name="motivation"
                    placeholder="Yetkili olmak isteme nedeninizi açıklayın."
                    required
                ></textarea>
            </div>

            <!-- 7 -->
            <div class="question">
                <label for="microphone">
                    7. Mikrofonunuz var mı?
                </label>

                <select
                    id="microphone"
                    name="microphone"
                    required
                >
                    <option value="">Seçiniz</option>
                    <option value="Evet">Evet</option>
                    <option value="Hayır">Hayır</option>
                </select>
            </div>

            <!-- 8 -->
            <div class="question">
                <label for="friend_rule_violation">
                    8. Yakın arkadaşınızın kural ihlali yaptığını görürseniz ne yaparsınız?
                </label>

                <textarea
                    id="friend_rule_violation"
                    name="friend_rule_violation"
                    placeholder="Nasıl bir işlem uygulayacağınızı açıklayın."
                    required
                ></textarea>
            </div>

            <!-- 9 -->
            <div class="question">
                <label for="repeated_questions">
                    9. Aynı soruyu defalarca soran bir oyuncuya nasıl yaklaşırsınız?
                </label>

                <textarea
                    id="repeated_questions"
                    name="repeated_questions"
                    placeholder="Oyuncuya nasıl yardımcı olacağınızı açıklayın."
                    required
                ></textarea>
            </div>

            <!-- 10 -->
            <div class="question">
                <label for="responsibility">
                    10. Size verilen bir sorumluluğu yerine getiremeyeceğinizi fark ederseniz ne yaparsınız?
                </label>

                <textarea
                    id="responsibility"
                    name="responsibility"
                    placeholder="İzleyeceğiniz yolu açıklayın."
                    required
                ></textarea>
            </div>

            <!-- 11 -->
            <div class="question">
                <label for="main_reason">
                    11. Neden özellikle SnMac'te yetkili olmak istiyorsunuz?
                </label>

                <textarea
                    id="main_reason"
                    name="main_reason"
                    placeholder="SnMac'i tercih etme nedeninizi açıklayın."
                    required
                ></textarea>
            </div>

            <!-- 12 -->
            <div class="question">
                <label for="about">
                    12. Kendinizi birkaç cümleyle anlatın.
                </label>

                <textarea
                    id="about"
                    name="about"
                    placeholder="Kendinizden bahsedin."
                    required
                ></textarea>
            </div>

            <button
                type="submit"
                id="submitButton"
            >
                Başvuruyu Gönder
            </button>

        </form>

        <div
            id="successMessage"
            class="message success"
        ></div>

        <div
            id="errorMessage"
            class="message error"
        ></div>

    </div>

</div>


<script>

/* =========================================
   SUPABASE AYARLARI
========================================= */

const SUPABASE_URL =
    "https://drfborwvynrwfljrqlmg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Sw6ra8A72oj7dXNnCX__rA_ZNxGtrpn";


/* =========================================
   SUPABASE BAĞLANTISI
========================================= */

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   HTML ELEMANLARI
========================================= */

const form =
    document.getElementById("applicationForm");

const submitButton =
    document.getElementById("submitButton");

const loggedEmail =
    document.getElementById("loggedEmail");

const successMessage =
    document.getElementById("successMessage");

const errorMessage =
    document.getElementById("errorMessage");

const testBox =
    document.getElementById("testBox");


/* =========================================
   MESAJ FONKSİYONLARI
========================================= */

function showError(message) {

    errorMessage.style.display = "block";

    errorMessage.innerHTML =
        "<strong>Hata:</strong><br>" +
        message;

    successMessage.style.display = "none";
}


function showSuccess(message) {

    successMessage.style.display = "block";

    successMessage.innerHTML =
        message;

    errorMessage.style.display = "none";
}


/* =========================================
   LOGIN KONTROLÜ
========================================= */

async function checkLogin() {

    console.log("LOGIN KONTROLÜ BAŞLADI");

    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        console.log("SESSION:", data);
        console.log("SESSION ERROR:", error);


        if (error) {

            loggedEmail.textContent =
                "Oturum kontrolünde hata";

            showError(
                "Oturum kontrol edilirken hata oluştu: " +
                error.message
            );

            return false;
        }


        if (!data.session) {

            loggedEmail.textContent =
                "Giriş yapılmamış";

            alert(
                "Başvuru göndermek için önce giriş yapmalısınız."
            );

            window.location.href =
                "login.html";

            return false;
        }


        loggedEmail.textContent =
            data.session.user.email;


        testBox.style.display =
            "block";

        testBox.textContent =
            "✓ Sistem hazır. Giriş yapılmış: " +
            data.session.user.email;


        console.log(
            "LOGIN BAŞARILI:",
            data.session.user.email
        );


        return true;

    } catch (error) {

        console.error(
            "LOGIN KONTROL HATASI:",
            error
        );

        showError(
            "Beklenmeyen hata: " +
            error.message
        );

        return false;
    }
}


/* =========================================
   FORM GÖNDERME
========================================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        console.log(
            "1 - FORM SUBMIT ÇALIŞTI"
        );


        submitButton.disabled =
            true;

        submitButton.textContent =
            "Başvuru Gönderiliyor...";


        errorMessage.style.display =
            "none";

        successMessage.style.display =
            "none";


        try {

            /* SESSION AL */

            const {
                data: sessionData,
                error: sessionError
            } =
                await supabaseClient.auth.getSession();


            console.log(
                "2 - SESSION:",
                sessionData
            );

            console.log(
                "3 - SESSION ERROR:",
                sessionError
            );


            if (
                sessionError ||
                !sessionData ||
                !sessionData.session
            ) {

                throw new Error(
                    "Aktif giriş oturumu bulunamadı. Lütfen tekrar giriş yapın."
                );
            }


            const session =
                sessionData.session;


            /* FORM VERİLERİ */

            const formData =
                new FormData(form);


            const applicationData = {

                user_id:
                    session.user.id,

                application_type:
                    "yetkili",

                fullname:
                    formData.get("fullname"),

                discord:
                    formData.get("discord"),

                age:
                    Number(
                        formData.get("age")
                    ),

                activity:
                    formData.get("activity"),

                experience:
                    formData.get("experience"),

                motivation:
                    formData.get("motivation"),

                microphone:
                    formData.get("microphone"),

                friend_rule_violation:
                    formData.get(
                        "friend_rule_violation"
                    ),

                repeated_questions:
                    formData.get(
                        "repeated_questions"
                    ),

                responsibility:
                    formData.get(
                        "responsibility"
                    ),

                main_reason:
                    formData.get(
                        "main_reason"
                    ),

                about:
                    formData.get("about"),

                status:
                    "Bekliyor"
            };


            console.log(
                "4 - GÖNDERİLECEK VERİ:",
                applicationData
            );


            /* SUPABASE INSERT */

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("applications")
                    .insert(
                        applicationData
                    )
                    .select()
                    .single();


            console.log(
                "5 - SUPABASE DATA:",
                data
            );

            console.log(
                "6 - SUPABASE ERROR:",
                error
            );


            /* HATA */

            if (error) {

                console.error(
                    "SUPABASE INSERT HATASI:",
                    error
                );

                throw new Error(
                    error.message +
                    " | Kod: " +
                    (error.code || "bilinmiyor")
                );
            }


            /* BAŞARILI */

            console.log(
                "BAŞVURU BAŞARIYLA GÖNDERİLDİ:",
                data
            );


            form.style.display =
                "none";


            testBox.style.display =
                "none";


            showSuccess(
                "<h3>✓ Başvurunuz başarıyla gönderildi!</h3>" +
                "<br>" +
                "Başvuru ID'niz:" +
                "<br><br>" +
                "<strong>" +
                data.id +
                "</strong>" +
                "<br><br>" +
                "Başvurunuz şu anda <strong>Bekliyor</strong> durumunda."
            );


        } catch (error) {

            console.error(
                "GENEL FORM HATASI:",
                error
            );


            showError(
                error.message ||
                "Bilinmeyen bir hata oluştu."
            );


            submitButton.disabled =
                false;


            submitButton.textContent =
                "Başvuruyu Gönder";
        }

    }
);


/* =========================================
   SAYFA AÇILINCA LOGIN KONTROLÜ
========================================= */

checkLogin();

</script>

</body>
</html>
